[project]
name = "civilcode-rag"
version = "0.1.0"
description = "Citation-grounded RAG Q&A over civil engineering codes, standards and course notes"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "pypdf", "python-docx", "fastapi", "uvicorn", "python-multipart", "anthropic", "python-dotenv"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
